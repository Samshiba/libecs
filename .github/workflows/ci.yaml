name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.config }}
    runs-on: ${{ matrix.toolchain.os }}

    strategy:
      fail-fast: false
      matrix:
        config: [ Release ]
        toolchain:
          - { name: MSVC, os: windows-latest, cxx: cl }
          - { name: GCC, os: ubuntu-latest, cxx: g++ }
          - { name: Clang, os: ubuntu-latest, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }}
          -DLIBECS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml

      - name: Run benchmark (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build\bin\libecs_bench.exe *> benchmark-results.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content benchmark-results.txt
            exit $LASTEXITCODE
          }

      - name: Run benchmark (Linux)
        if: always() && runner.os == 'Linux'
        run: ./build/bin/libecs_bench > benchmark-results.txt

      - name: Upload test and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.toolchain.name }}-${{ matrix.config }}
          path: |
            test-results.xml
            benchmark-results.txt
          if-no-files-found: warn
          retention-days: 14
