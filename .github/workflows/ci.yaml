name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.config }}
    runs-on: ${{ matrix.toolchain.os }}

    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
        toolchain:
          - { name: MSVC, os: windows-latest, cxx: cl }
          - { name: GCC, os: ubuntu-latest, cxx: g++ }
          - { name: Clang, os: ubuntu-latest, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }}
          -DLIBECS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
